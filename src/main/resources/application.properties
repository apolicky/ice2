springdoc.swagger-ui.path=/swagger
#spring.data.neo4j.database=footprints
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=your_password
ice.minCountOfOccurrencesForDistribution=3
ice.nullMatchesAllPatterns=false
ice.computeValueDistribution=false
ice.rowComparisonThreshold=0.98
ice.aggregatedComparison_shouldFilterAllUnknownResults=true
ice.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss
# ice.dateTimeFormat=yyyy-MM-dd HH:mm:ss
#ice.dateTimeFormat=yyyy-MM-dd
logging.level.xyz.apolicky.constraints.utils.SparkHelpers=WARN
logging.level.xyz.apolicky.constraints.columnmetadata.helpers.InfoHelpers=ERROR
